services:
  postgres:
    image: postgres:15
    container_name: sandbox-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: sandbox_db
    ports:
      - "5433:5432"
    volumes:
      # Maps the permanent volume to Postgres' internal data folder
      - postgres_data:/var/lib/postgresql/data

  ml-worker:
    build: ./ml-worker
    container_name: ml-worker
    ports:
      - "8000:8000"

  node-api:
    build: .
    container_name: node-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:secretpassword@postgres:5432/sandbox_db?schema=public"
      PORT: 3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - ml-worker

# Declare the named volume so Docker knows to create and persist it
volumes:
  postgres_data: